version: 2

sources:
  - name: google_sheets
    database: "{{ env_var('DBT_BRONZE_DB') }}"
    schema: google_sheets
    tables:
      - name: budget
        columns:
          - name: quantity
            data_tests:
              - positive_values
          - name: _row
            data_tests:
              - not_null
              - unique
              - relationships:
                  arguments:
                    to: ref('slv_sql_server_dbo__products')
                    field: product_id

